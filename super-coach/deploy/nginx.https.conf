# Keep HTTP available so existing browser-local conversations remain accessible.
server {
    listen 80;
    server_name 112.74.63.237;
    client_max_body_size 128k;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tanxun-acme; }
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    server_name 112.74.63.237;
    ssl_certificate /etc/letsencrypt/live/112.74.63.237/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/112.74.63.237/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
