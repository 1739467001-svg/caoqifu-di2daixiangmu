name: tanxun
services:
  coach:
    image: tanxun-coach:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: ..
      args:
        NODE_IMAGE: public.ecr.aws/docker/library/node@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 100
    # Private host file, outside release archives and Docker build context.
    env_file:
      - path: /opt/tanxun/runtime.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3210
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
    ports:
      - "127.0.0.1:3210:3210"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
