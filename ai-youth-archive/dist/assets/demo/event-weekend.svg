<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">周末发明家冲刺演示海报</title>
  <desc id="desc">白底黑绿海报，用爆炸构造图展示零件、方块和齿轮如何组成一个新发明。</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#202320" stroke-opacity=".08" fill="none"/></pattern><pattern id="check" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#fff"/><path d="M0 0h16v16H0zm16 16h16v16H16z" fill="#202320"/></pattern></defs>
  <rect width="960" height="540" fill="#fff"/>
  <rect x="426" width="534" height="540" fill="url(#grid)"/>
  <path d="M450 0v540" stroke="#202320" stroke-width="2"/>
  <rect x="0" y="498" width="960" height="42" fill="url(#check)"/>
  <rect x="54" y="47" width="134" height="31" rx="15" fill="#202320"/><text x="121" y="68" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="700">把周末用来创造</text>
  <g fill="#202320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="900"><text x="51" y="157" font-size="54">周末发明家</text><text x="51" y="222" font-size="54">冲刺</text></g>
  <rect x="54" y="250" width="127" height="9" fill="#9ddb69"/>
  <text x="54" y="294" fill="#656a62" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19">拆开问题，拼出新办法。</text>
  <g transform="translate(50 355)" font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="4" y="24" fill="#202320" font-size="23" font-weight="800">想法 → 原型 → 演示</text><text x="4" y="57" fill="#656a62" font-size="15">小工具、小游戏，都可以开工。</text></g>
  <g fill="none" stroke="#202320" stroke-width="2" stroke-dasharray="6 7"><path d="M685 105v348M515 308h327M581 160 812 391"/></g>
