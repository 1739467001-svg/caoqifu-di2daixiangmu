<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">脑洞贴贴墙作品演示封面</title>
  <desc id="desc">白底协作想法板的原创插画，多张黑绿卡片由虚线路径连接，代表同伴一起整理灵感。</desc>
  <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#202320" opacity=".1"/></pattern></defs>
  <rect width="960" height="540" fill="#fff"/><rect x="285" width="675" height="540" fill="url(#dots)"/>
  <circle cx="701" cy="274" r="206" fill="#9ddb69" opacity=".21"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#202320"><text x="53" y="93" font-size="39" font-weight="900">脑洞贴贴墙</text><text x="55" y="127" font-size="17" fill="#656a62">想到什么，就一起接着想。</text></g>
  <g fill="none" stroke="#202320" stroke-width="2.5" stroke-dasharray="6 8"><path d="M297 251c55 0 25-134 124-134M466 185c110 0 5 88 129 88M468 337c78 0 46 81 163 81M730 303v48"/></g>
