  <g transform="translate(635 128) rotate(6 120 88)"><rect x="7" y="8" width="248" height="164" rx="18" fill="#202320"/><rect width="248" height="164" rx="18" fill="#9ddb69" stroke="#202320" stroke-width="2.5"/><path d="M28 26h33m-16-9v18" stroke="#202320" stroke-width="3"/><g fill="#202320" font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="81" font-size="22" font-weight="800">让想法接力</text><text x="24" y="112" font-size="14">你补一句，我再改一版。</text></g><g fill="#202320"><circle cx="180" cy="137" r="9"/><circle cx="204" cy="137" r="9"/><circle cx="228" cy="137" r="9"/></g></g>
  <g transform="translate(350 274) rotate(4 117 88)"><rect x="7" y="8" width="244" height="156" rx="18" fill="#202320"/><rect width="244" height="156" rx="18" fill="#202320"/><rect x="22" y="22" width="53" height="8" rx="4" fill="#9ddb69"/><g fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="22" y="72" font-size="23" font-weight="800">这次先做小一点</text><text x="22" y="103" font-size="14" fill-opacity=".7">做出来，再带来试试。</text></g><path d="M23 130h104" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M189 125h28m-9-9 9 9-9 9" fill="none" stroke="#9ddb69" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
